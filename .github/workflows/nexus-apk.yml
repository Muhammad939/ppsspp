name: NEXUS Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: nexus-texture-performance-profile
        type: string

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NEXUS fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.31.6"

      - name: Build optimized arm64 APK
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleNormalOptimized --no-daemon --stacktrace

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-psp-arm64-apk
          if-no-files-found: error
          path: |
            android/build/**/*.apk
            android/app/build/**/*.apk
